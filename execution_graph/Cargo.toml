[package]
name = "execution_graph"
description = "Incremental execution graph with pluggable node executors"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["vm", "bytecode", "no_std", "incremental"]
categories = ["no-std", "virtualization"]

[features]
default = ["tape"]
std = ["execution_tape?/std"]
# Run verified `execution_tape` programs as graph nodes via `TapeExecutor`.
tape = ["dep:execution_tape"]

[lints]
workspace = true

[dependencies]
execution_tape = { workspace = true, optional = true }
hashbrown = { default-features = false, features = [
  "default-hasher",
], version = "0.17.0" }
invalidation = "0.2.0"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
